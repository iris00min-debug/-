<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>샌드백 패기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eeece6;
  --bg-2:#e2dfd6;
  --panel:#f8f7f3;
  --line:#cfccc2;
  --ink:#28271f;
  --sub:#8a8779;
  --accent:#7c6fff;
  --accent-2:#5a4fd6;
  --warn:#ff6b6b;
  --domain:#8a5cff;
  --bagred:#c22b2b;
  --bagred-2:#8f1f1f;
  --bagred-dark:#5c1414;
  --radius:16px;
  --font-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-hanja:"Nanum Myeongjo","Noto Serif KR",serif;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
:root:not([data-theme="light"]){}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  overflow:hidden;
  touch-action:manipulation;
  user-select:none;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 무대 ---------- */
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center}
#shaker{position:absolute;inset:0;will-change:transform}

#beam{
  position:absolute;top:0;left:0;right:0;height:14px;
  background:var(--line);
}
#floor{
  position:absolute;left:0;right:0;bottom:0;height:12vh;
  background:linear-gradient(180deg, transparent, rgba(0,0,0,.35));
  border-top:1px solid var(--line);
}

#pivot{
  position:absolute;top:14px;left:50%;
  transform-origin:top center;
  will-change:transform;
}
#chain{
  width:4px;height:9vh;margin:0 auto;
  background:var(--line);
}
#bagWrap{margin-left:-78px;width:156px;will-change:transform}

#bag{
  position:relative;width:156px;height:min(56vh,420px);
  background:var(--bagred);
  border:2px solid #3a0e0e;
  border-radius:60px 60px 46px 46px;
  box-shadow:0 14px 30px rgba(0,0,0,.45);
  overflow:hidden;
}
#bag::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 2px, transparent 2px 34px);
  opacity:.5;pointer-events:none;
}
#bag .strap{
  position:absolute;left:0;right:0;height:11px;background:#1a1414;
  box-shadow:0 1px 0 rgba(0,0,0,.4), 0 -1px 0 rgba(255,255,255,.05);
}
#bag .strap.top{top:26px}
#bag .strap.bottom{bottom:36px}

#face{
  position:absolute;left:50%;top:56px;transform:translateX(-50%);
  width:112px;height:112px;border-radius:50%;
  border:2px solid #3a0e0e;
  background:var(--bg-2);
  overflow:hidden;display:grid;place-items:center;
  box-shadow:0 4px 10px rgba(0,0,0,.35);
}
#face img{width:100%;height:100%;object-fit:cover;display:block}
#defaultFace{width:100%;height:100%}

#nameTag{
  position:absolute;left:50%;bottom:44px;transform:translateX(-50%);
  max-width:130px;padding:3px 12px 5px;
  background:var(--bg-2);color:var(--ink);
  border:1px solid #3a0e0e;border-radius:8px;
  font-weight:500;font-size:13px;line-height:1.3;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ---------- HUD ---------- */
#hud{position:absolute;top:64px;left:0;right:0;display:flex;justify-content:space-between;
  padding:0 16px;pointer-events:none;gap:10px}
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:8px 14px 9px;min-width:78px;
}
#countLabel,#bestLabel{font-size:12px;color:var(--sub);margin-bottom:2px}
#count{font-family:var(--font-display);font-size:26px;line-height:1;color:var(--ink)}
#best{font-family:var(--font-display);font-size:20px;line-height:1;color:var(--accent)}
#combo{
  position:absolute;top:166px;left:50%;transform:translateX(-50%);
  font-family:var(--font-display);font-size:22px;color:var(--accent);
  opacity:0;transition:opacity .2s;pointer-events:none;
}
#combo.on{opacity:1}

#escBtn{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);pointer-events:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:6px 14px;font-size:12px;color:var(--sub);
}

/* ---------- 조작 ---------- */
#controls{
  position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));
  display:flex;gap:10px;justify-content:center;align-items:flex-end;padding:0 14px;
}
.key{
  background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:14px;
  padding:12px 22px 13px;font-size:17px;line-height:1.15;text-align:center;
  transition:transform .06s, background .12s;
  min-width:76px;
}
.key small{display:block;font-size:11px;color:var(--sub);margin-top:3px;font-weight:400}
.key:active,.key.press{transform:translateY(3px);background:var(--bg-2)}
.key.special{background:var(--accent-2);border-color:var(--accent);color:#fff}
.key.special:disabled{filter:grayscale(.5) brightness(.7);cursor:not-allowed}
.key.special .emoji{font-size:20px;display:block}
.key.ghost{background:transparent;border:1px solid var(--line);color:var(--sub);font-size:13px;padding:10px 14px 11px;min-width:auto}
#cool{
  position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0%;
}
.key.special{position:relative;overflow:hidden}

/* ---------- 글러브 ---------- */
.glove{
  position:absolute;width:78px;height:78px;pointer-events:none;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));
}
@keyframes gloveLeft{
  0%{transform:translate(-120px,10px) rotate(-18deg) scale(.8);opacity:0}
  35%{opacity:1}
  55%{transform:translate(6px,-4px) rotate(6deg) scale(1.04)}
  100%{transform:translate(-30px,4px) rotate(-6deg) scale(.94);opacity:0}
}
@keyframes gloveRight{
  0%{transform:translate(120px,10px) rotate(18deg) scale(.8);opacity:0}
  35%{opacity:1}
  55%{transform:translate(-6px,-4px) rotate(-6deg) scale(1.04)}
  100%{transform:translate(30px,4px) rotate(6deg) scale(.94);opacity:0}
}

/* ---------- 이펙트 ---------- */
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pow{
  position:absolute;font-family:var(--font-display);font-size:30px;color:var(--ink);
  text-shadow:0 2px 0 rgba(0,0,0,.5);
  animation:pow .5s ease-out forwards;
}
@keyframes pow{
  0%{transform:translate(-50%,-50%) scale(.5);opacity:1}
  60%{transform:translate(-50%,-90%) scale(1.08);opacity:1}
  100%{transform:translate(-50%,-130%) scale(1);opacity:0}
}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);animation:spark .45s linear forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* ---------- 영역전개 ---------- */
#domainLayer{position:absolute;inset:0;pointer-events:none;display:none;overflow:hidden;z-index:30}
#domainLayer.on{display:block}
#vignette{position:absolute;inset:0;opacity:0;background:
  radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(20,10,40,.6) 76%, rgba(6,4,14,.95) 100%);
  transition:opacity .5s ease;
}
#vignette.on{opacity:1}
#blackout{position:absolute;inset:0;background:#050308;opacity:0;transition:opacity 1.4s ease-in}
#blackout.on{opacity:.78}
#blackout.gone{opacity:0;transition:opacity .5s ease-out}
#gojoWrap{
  position:absolute;left:50%;top:-70vh;transform:translateX(-50%);
  width:min(46vw,220px);
  transition:top 1s cubic-bezier(.22,.9,.32,1.1);
}
#gojoWrap.down{top:6vh}
#gojoWrap.rumble{animation:rumbleShake .12s linear infinite}
@keyframes rumbleShake{
  0%,100%{margin-left:0}
  25%{margin-left:-3px}
  75%{margin-left:3px}
}
#gojoWrap img{width:100%;display:block;filter:drop-shadow(0 20px 30px rgba(0,0,0,.6))}
#ryoikiText{
  position:absolute;left:50%;top:14vh;transform:translateX(-50%);
  font-family:var(--font-hanja);font-weight:800;font-size:min(16vw,84px);color:#f4efe1;
  text-shadow:0 0 34px rgba(124,111,255,1), 0 0 70px rgba(124,111,255,.6), 0 3px 0 rgba(0,0,0,.6);
  opacity:0;letter-spacing:.14em;white-space:nowrap;
}
#ryoikiText.on{animation:ryoikiIn .6s ease-out forwards}
@keyframes ryoikiIn{from{opacity:0;transform:translateX(-50%) scale(1.8)}to{opacity:1;transform:translateX(-50%) scale(1)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#flash.on{animation:flashOn 1.1s ease-out forwards}
@keyframes flashOn{0%{opacity:0}8%{opacity:1}30%{opacity:.5}100%{opacity:0}}
#counterText{
  position:absolute;left:50%;top:36vh;transform:translateX(-50%) scale(1.4);
  font-family:var(--font-hanja);font-weight:800;font-size:min(19vw,100px);color:#ffd166;
  text-shadow:0 0 40px rgba(255,140,60,1), 0 0 90px rgba(255,90,40,.7), 0 3px 0 rgba(0,0,0,.6);
  opacity:0;letter-spacing:.1em;white-space:nowrap;
}
#counterText.on{animation:counterIn .6s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes counterIn{
  0%{opacity:0;transform:translateX(-50%) scale(3) rotate(-3deg)}
  55%{opacity:1;transform:translateX(-50%) scale(.92) rotate(1deg)}
  100%{opacity:1;transform:translateX(-50%) scale(1.08) rotate(0)}
}
.void-ring{position:absolute;left:50%;top:45%;width:10px;height:10px;border-radius:50%;
  border:2px solid rgba(124,111,255,.55);transform:translate(-50%,-50%);opacity:0}
.void-ring.on{animation:ringOut 1.6s ease-out forwards}
.void-ring.big.on{animation:ringOut .9s cubic-bezier(.1,.7,.25,1) forwards;border-width:6px;border-color:rgba(255,209,102,.8)}
@keyframes ringOut{0%{width:10px;height:10px;opacity:.85}100%{width:200vmax;height:200vmax;opacity:0}}

@keyframes explode{
  0%{transform:translateY(0) scale(1) rotate(0);opacity:1;filter:none}
  14%{transform:translateY(6px) scale(1.28,.8) rotate(0);opacity:1}
  26%{transform:translateY(-10vh) scale(.85,1.15) rotate(-6deg);opacity:1;filter:blur(0)}
  55%{transform:translateY(-70vh) scale(.6) rotate(-30deg);opacity:.9;filter:blur(2px)}
  100%{transform:translateY(-170vh) scale(.3) rotate(-70deg);opacity:0;filter:blur(6px)}
}
#bagWrap.exploding{animation:explode 1.05s cubic-bezier(.2,.55,.25,1) forwards}
@keyframes dropIn{
  0%{transform:translateY(-52vh) scale(.92);opacity:0}
  62%{transform:translateY(10px) scale(1.02);opacity:1}
  80%{transform:translateY(-8px) scale(.99)}
  100%{transform:translateY(0) scale(1)}
}
#bagWrap.dropping{animation:dropIn 1.3s cubic-bezier(.16,.7,.25,1) forwards}
.shard{position:absolute;width:14px;height:10px;background:var(--bagred);
  border:2px solid var(--bagred-dark);animation:shardOut 1.1s ease-out forwards}
@keyframes shardOut{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
#screenBoom{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%, rgba(255,209,102,.75), rgba(138,92,255,.45) 45%, transparent 70%);opacity:0}
#screenBoom.on{animation:boomFlash 1.3s ease-out forwards}
@keyframes boomFlash{0%{opacity:0}10%{opacity:1}100%{opacity:0}}

/* ---------- 설정 화면 ---------- */
#setup{
  position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;
  background:rgba(10,11,16,.88);overflow:auto;
}
#setup .card{
  width:min(420px,100%);background:var(--panel);
  border:1px solid var(--line);border-radius:20px;
  padding:28px 26px 26px;
}
#setup h1{margin:0;font-family:var(--font-display);font-size:32px;line-height:1.15;color:var(--ink)}
#setup .lede{margin:8px 0 22px;font-size:14px;color:var(--sub)}
.field{margin-bottom:18px}
.field > span{display:block;margin-bottom:8px;font-size:14px;color:var(--sub)}
.hint{font-size:12px;color:var(--sub);margin-top:6px}
input[type=text]{
  width:100%;padding:11px 13px;font-size:15px;
  background:var(--bg-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;
}
input[type=text]:focus{border-color:var(--accent)}
.pickRow{display:flex;gap:12px;align-items:center}
#preview{
  width:60px;height:60px;flex:0 0 60px;border-radius:50%;
  border:1px solid var(--line);background:var(--bg-2);overflow:hidden;display:grid;place-items:center
}
#preview img{width:100%;height:100%;object-fit:cover}
.filebtn{flex:1;position:relative;overflow:hidden;display:block}
.filebtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
#start{width:100%;background:var(--accent);border-color:var(--accent);color:#fff;font-size:16px;font-weight:700;padding:13px 16px 14px}
.privacy{margin-top:14px;font-size:12px;color:var(--sub);text-align:center}

/* ---------- 크롭 모달 ---------- */
#cropModal{
  position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:20px;
  background:rgba(10,11,16,.9);overflow:auto;
}
#cropModal.on{display:grid}
#cropModal .card{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 22px 22px}
#cropStage{
  position:relative;width:100%;aspect-ratio:1/1;border-radius:16px;overflow:hidden;
  background:var(--bg-2);border:1px solid var(--line);touch-action:none;cursor:grab;
}
#cropStage.grabbing{cursor:grabbing}
#cropImg{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;pointer-events:none;max-width:none}
#cropMask{position:absolute;inset:0;box-shadow:0 0 0 999px rgba(0,0,0,.35) inset;border-radius:16px;pointer-events:none}

@media (max-width:520px){
  #bag{width:132px;height:186px}
  #bagWrap{width:132px;margin-left:-66px}
  #face{width:90px;height:90px;top:58px}
  #nameTag{font-size:12px;max-width:110px}
  #count{font-size:20px}
  .key{padding:10px 16px 11px;font-size:15px;min-width:60px}
}
@media (prefers-reduced-motion:reduce){
  #gojoWrap, #gojoWrap.rumble, #vignette, #blackout, #ryoikiText, #counterText, .void-ring, #flash, #screenBoom, #bagWrap.exploding, #bagWrap.dropping{transition:none;animation:none!important}
}
</style>
</head>
<body>

<div id="stage">
  <div id="shaker">
    <div id="beam"></div>
    <div id="floor"></div>
    <div id="pivot">
      <div id="chain"></div>
      <div id="bagWrap">
        <div id="bag">
          <div class="strap top"></div>
          <div class="strap bottom"></div>
          <div id="face">
            <svg id="defaultFace" viewBox="0 0 100 100" aria-hidden="true">
              <circle cx="34" cy="42" r="5" fill="#9aa0b4"/>
              <circle cx="66" cy="42" r="5" fill="#9aa0b4"/>
              <path d="M32 66 Q50 58 68 66" stroke="#9aa0b4" stroke-width="4" fill="none" stroke-linecap="round"/>
            </svg>
          </div>
          <div id="nameTag">샌드백</div>
        </div>
      </div>
    </div>
  </div>

  <div id="hud">
    <div class="panel"><div id="countLabel">현재 타격</div><div id="count">0</div></div>
    <div class="panel"><div id="bestLabel">최고 기록</div><div id="best">0</div></div>
  </div>
  <div id="combo"></div>
  <button id="escBtn">ESC 사진 바꾸기</button>

  <div id="fx"></div>

  <div id="domainLayer">
    <div id="vignette"></div>
    <div id="blackout"></div>
    <div class="void-ring" id="ring1"></div>
    <div class="void-ring" id="ring2"></div>
    <div class="void-ring big" id="ring3"></div>
    <div id="gojoWrap"><img id="gojoImg" alt="영역전개"></div>
    <div id="ryoikiText">領域展開</div>
    <div id="counterText">無量空処</div>
    <div id="screenBoom"></div>
    <div id="flash"></div>
  </div>

  <div id="controls">
    <button class="key" id="leftBtn">A<small>왼쪽 펀치</small></button>
    <button class="key" id="rightBtn">D<small>오른쪽 펀치</small></button>
    <button class="key special" id="domainBtn"><span class="emoji">🤞</span>R<span id="cool"></span></button>
  </div>
</div>

<div id="setup">
  <div class="card">
    <h1>샌드백 만들기</h1>
    <p class="lede">사진 없이도, 이름 없이도 바로 팰 수 있어요.</p>

    <div class="field">
      <span>얼굴 사진</span>
      <div class="pickRow">
        <div id="preview"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="34" cy="44" r="5" fill="#9aa0b4"/><circle cx="66" cy="44" r="5" fill="#9aa0b4"/><path d="M32 66 Q50 58 68 66" stroke="#9aa0b4" stroke-width="4" fill="none" stroke-linecap="round"/></svg></div>
        <label class="key filebtn" id="pickBtn" for="file">사진 불러오기
          <input type="file" id="file" accept="image/*">
        </label>
      </div>
      <div class="hint">사진은 이 브라우저 안에서만 쓰이고 서버로 전송되지 않아요.</div>
    </div>

    <div class="field">
      <span>샌드백 이름</span>
      <input type="text" id="label" maxlength="14" placeholder="예: 월요일" value="">
    </div>

    <button class="key" id="start">패기</button>
    <p class="privacy">A·D 펀치 · R 영역전개</p>
  </div>
</div>

<div id="cropModal">
  <div class="card">
    <h1 style="font-size:22px">사진 자르기</h1>
    <p class="lede" style="margin-bottom:14px">드래그로 위치, 슬라이더로 확대/축소해서 얼굴을 맞춰주세요.</p>
    <div id="cropStage">
      <img id="cropImg" alt="자르기 미리보기" draggable="false">
      <div id="cropMask"></div>
    </div>
    <input type="range" id="cropZoom" min="100" max="300" value="100" style="width:100%;margin-top:14px">
    <div class="pickRow" style="margin-top:16px">
      <button class="key ghost" id="cropCancel" style="flex:1">취소</button>
      <button class="key" id="cropConfirm" style="flex:1;background:var(--accent);border-color:var(--accent);color:#fff">완료</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };

  var pivot=$("#pivot"), bagWrap=$("#bagWrap"), bag=$("#bag"), shaker=$("#shaker"),
      face=$("#face"), nameTag=$("#nameTag"), fx=$("#fx"),
      countEl=$("#count"), bestEl=$("#best"), comboEl=$("#combo"), cool=$("#cool"),
      setup=$("#setup"), fileInput=$("#file"), preview=$("#preview"),
      domainBtn=$("#domainBtn"), escBtn=$("#escBtn"),
      domainLayer=$("#domainLayer"), vignette=$("#vignette"), blackout=$("#blackout"), gojoWrap=$("#gojoWrap"),
      ryoikiText=$("#ryoikiText"), counterText=$("#counterText"), flash=$("#flash"),
      ring1=$("#ring1"), ring2=$("#ring2"), ring3=$("#ring3"), screenBoom=$("#screenBoom"),
      cropModal=$("#cropModal"), cropStage=$("#cropStage"), cropImg=$("#cropImg"), cropZoom=$("#cropZoom"),
      cropCancel=$("#cropCancel"), cropConfirm=$("#cropConfirm");

  var angle=0, vel=0, squash=0, shake=0, shakeT=0;

  /* ---------- 소리 (타격음 합성) ---------- */
  var actx=null;
  function ac(){
    if(!actx){
      var C=window.AudioContext||window.webkitAudioContext;
      if(!C) return null;
      actx=new C();
    }
    if(actx.state==="suspended") actx.resume();
    return actx;
  }
  var noiseBuf=null;
  function noise(ctx){
    if(!noiseBuf){
      noiseBuf=ctx.createBuffer(1, ctx.sampleRate*0.4, ctx.sampleRate);
      var d=noiseBuf.getChannelData(0);
      for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }
    var s=ctx.createBufferSource(); s.buffer=noiseBuf; return s;
  }
  function punchSound(power){
    var ctx=ac(); if(!ctx) return;
    var t=ctx.currentTime;
    var src=noise(ctx), filt=ctx.createBiquadFilter(), g=ctx.createGain();
    filt.type="lowpass"; filt.frequency.setValueAtTime(1700+power*800,t);
    filt.frequency.exponentialRampToValueAtTime(220,t+0.13);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.45*power,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
    src.connect(filt); filt.connect(g); g.connect(ctx.destination);
    src.start(t); src.stop(t+0.22);

    var o=ctx.createOscillator(), og=ctx.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(46,t+0.15);
    og.gain.setValueAtTime(0.0001,t);
    og.gain.exponentialRampToValueAtTime(0.4*power,t+0.01);
    og.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
    o.connect(og); og.connect(ctx.destination);
    o.start(t); o.stop(t+0.22);
  }
  function boomSound(){
    var ctx=ac(); if(!ctx) return;
    var t=ctx.currentTime;

    // 저역 서브 스웰 (퍼엉 하고 부풀어오르는 느낌)
    var o=ctx.createOscillator(), og=ctx.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(95,t); o.frequency.exponentialRampToValueAtTime(24,t+1.5);
    og.gain.setValueAtTime(0.0001,t);
    og.gain.linearRampToValueAtTime(0.85,t+0.16);
    og.gain.exponentialRampToValueAtTime(0.0001,t+1.7);
    o.connect(og); og.connect(ctx.destination);
    o.start(t); o.stop(t+1.75);

    // 뭉근한 바람 폭발음 (밴드패스로 스냅 없이 퍼지게)
    var src=noise(ctx), filt=ctx.createBiquadFilter(), g=ctx.createGain();
    filt.type="bandpass"; filt.Q.value=0.7;
    filt.frequency.setValueAtTime(700,t);
    filt.frequency.linearRampToValueAtTime(130,t+1.6);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.55,t+0.14);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.7);
    src.connect(filt); filt.connect(g); g.connect(ctx.destination);
    src.start(t); src.stop(t+1.75);

    // 뒤이어 오는 낮은 여운
    setTimeout(function(){
      var ctx2=ac(); if(!ctx2) return;
      var t2=ctx2.currentTime;
      var o2=ctx2.createOscillator(), og2=ctx2.createGain();
      o2.type="sine";
      o2.frequency.setValueAtTime(55,t2); o2.frequency.exponentialRampToValueAtTime(18,t2+1.1);
      og2.gain.setValueAtTime(0.0001,t2);
      og2.gain.linearRampToValueAtTime(0.35,t2+0.12);
      og2.gain.exponentialRampToValueAtTime(0.0001,t2+1.2);
      o2.connect(og2); og2.connect(ctx2.destination);
      o2.start(t2); o2.stop(t2+1.25);
    }, 260);
  }
  function rumbleSound(durationMs){
    var ctx=ac(); if(!ctx) return;
    var t=ctx.currentTime, dur=durationMs/1000;
    var src=noise(ctx), filt=ctx.createBiquadFilter(), g=ctx.createGain();
    filt.type="lowpass"; filt.frequency.setValueAtTime(160,t);
    filt.frequency.linearRampToValueAtTime(260,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.28,t+dur*0.7);
    g.gain.linearRampToValueAtTime(0.0001,t+dur);
    src.loop=true;
    src.connect(filt); filt.connect(g); g.connect(ctx.destination);
    src.start(t); src.stop(t+dur);
  }

  /* ---------- 글러브 (SVG, 코드 생성) ---------- */
  function gloveSVG(dir){
    var flip = dir<0 ? "scaleX(-1)" : "none";
    return '<svg class="glove" viewBox="0 0 100 100" style="transform:'+flip+'" aria-hidden="true">'+
      '<ellipse cx="46" cy="58" rx="34" ry="30" fill="#c22b2b" stroke="#3a0e0e" stroke-width="4"/>'+
      '<path d="M20 46 q-14 4 -14 18 q0 14 14 12 q10 -2 12 -14 q1 -12 -12 -16Z" fill="#c22b2b" stroke="#3a0e0e" stroke-width="4"/>'+
      '<path d="M18 60 q26 6 44 -2" stroke="#8f1f1f" stroke-width="4" fill="none" stroke-linecap="round"/>'+
      '<rect x="58" y="70" width="26" height="16" rx="6" fill="#eef0f6" stroke="#3a0e0e" stroke-width="4"/>'+
    '</svg>';
  }

  /* ---------- 이펙트 ---------- */
  var WORDS=["퍽!","팍!","빠악!","퍼억!","쾅!","펑!"];
  function popWord(x,y,big,customText){
    var el=document.createElement("div");
    el.className="pow";
    el.textContent=customText || WORDS[(Math.random()*WORDS.length)|0];
    el.style.left=x+"px"; el.style.top=y+"px";
    if(big) el.style.fontSize="42px";
    if(customText){ el.style.fontSize="56px"; el.style.color="var(--domain)"; }
    fx.appendChild(el);
    setTimeout(function(){ el.remove(); },customText?700:520);
  }
  function sparks(x,y,n){
    for(var i=0;i<n;i++){
      var s=document.createElement("div");
      s.className="spark";
      var a=Math.random()*Math.PI*2, d=30+Math.random()*70;
      s.style.left=x+"px"; s.style.top=y+"px";
      s.style.setProperty("--dx",(Math.cos(a)*d)+"px");
      s.style.setProperty("--dy",(Math.sin(a)*d)+"px");
      fx.appendChild(s);
      setTimeout((function(el){ return function(){ el.remove(); }; })(s),470);
    }
  }
  function shards(x,y,n){
    for(var i=0;i<n;i++){
      var s=document.createElement("div");
      s.className="shard";
      var a=Math.random()*Math.PI*2, d=90+Math.random()*220;
      s.style.left=x+"px"; s.style.top=y+"px";
      s.style.setProperty("--dx",(Math.cos(a)*d)+"px");
      s.style.setProperty("--dy",(Math.sin(a)*d)+"px");
      s.style.setProperty("--rot",(Math.random()*540-270)+"deg");
      fx.appendChild(s);
      setTimeout((function(el){ return function(){ el.remove(); }; })(s),820);
    }
  }
  function bagCenter(){
    var r=bag.getBoundingClientRect();
    return { x:r.left+r.width/2, y:r.top+r.height*0.4 };
  }
  function showGlove(dir,x,y){
    var g=document.createElement("div");
    g.innerHTML=gloveSVG(dir);
    var el=g.firstChild;
    el.style.left=(x-39)+"px"; el.style.top=(y-39)+"px";
    el.style.animation=(dir<0?"gloveLeft":"gloveRight")+" .32s ease-out forwards";
    fx.appendChild(el);
    setTimeout(function(){ el.remove(); },340);
  }

  /* ---------- 때리기 ---------- */
  function hit(dir, power, silentCount){
    power=power||1;
    vel += dir*(0.055*power);
    squash = 0.2*power;
    shake = reduce ? 0.25*power : 1*power;
    shakeT = 0;

    var c=bagCenter();
    showGlove(dir, c.x, c.y);
    popWord(c.x + dir*26, c.y, power>1.3);
    sparks(c.x, c.y, power>1.3 ? 10 : 6);
    punchSound(Math.min(power,1.6));

    if(!silentCount){
      hits++; countEl.textContent=hits;
      combo++; comboTimer=1.1;
      if(combo>=3){ comboEl.textContent=combo+" 연타"; comboEl.classList.add("on"); }
      if(hits>best){
        best=hits; bestEl.textContent=best;
        try{ localStorage.setItem("sandbag.best", String(best)); }catch(e){}
      }
    }
  }

  /* ---------- 영역전개 시퀀스 ---------- */
  function startDomain(){
    var now=performance.now();
    if(domainBusy || now<domainReady) return;
    domainBusy=true;
    domainBtn.disabled=true;

    ac();
    domainLayer.classList.add("on");
    vignette.classList.add("on");
    gojoWrap.classList.add("down");
    ring1.classList.add("on");
    try{ ryoikiAudio.currentTime=0; ryoikiAudio.play(); }catch(e){}

    // 고죠 등장 + 료이키텐카이
    setTimeout(function(){
      ryoikiText.classList.add("on");
    }, 500);

    // 쿠구구구궁: 점점 커지는 진동으로 긴장감 쌓기
    var RUMBLE_START = 900;
    var RUMBLE_MS = 2100;
    setTimeout(function(){
      blackout.classList.add("on");
      gojoWrap.classList.add("rumble");
      ring2.classList.add("on");
      rumbleSound(RUMBLE_MS);
    }, RUMBLE_START);
    setTimeout(function(){ shake = 0.3; shakeT = 0; }, RUMBLE_START + 300);
    setTimeout(function(){ shake = 0.5; shakeT = 0; }, RUMBLE_START + 900);
    setTimeout(function(){ shake = 0.8; shakeT = 0; }, RUMBLE_START + 1500);
    setTimeout(function(){ shake = 1.1; shakeT = 0; }, RUMBLE_START + RUMBLE_MS - 200);

    // 콰아아아앙: 무량공처 폭발 + 반격
    var BOOM_AT = RUMBLE_START + RUMBLE_MS + 150;
    setTimeout(function(){
      gojoWrap.classList.remove("rumble");
      blackout.classList.remove("on");
      blackout.classList.add("gone");
      counterText.classList.add("on");
      flash.classList.add("on");
      screenBoom.classList.add("on");
      ring3.classList.add("on");
      try{ muryoAudio.currentTime=0; muryoAudio.play(); }catch(e){}
      boomSound();

      var c=bagCenter();
      sparks(c.x, c.y, 46);
      shards(c.x, c.y, 26);
      popWord(c.x, c.y, true);

      shake = 3.2; shakeT = 0;
      bagWrap.classList.add("exploding");
    }, BOOM_AT);

    // 정적 후, 천천히 다시 샌드백 내려옴
    var DROP_AT = BOOM_AT + 1400;
    setTimeout(function(){
      bagWrap.classList.remove("exploding");
      bagWrap.style.transform="";
      angle=0; vel=0; squash=0;
      bagWrap.classList.add("dropping");
      shake=0.9; shakeT=0;
    }, DROP_AT);

    var DROP_END = DROP_AT + 1350;
    setTimeout(function(){
      bagWrap.classList.remove("dropping");
    }, DROP_END);

    var TOTAL = DROP_END + 250;
    setTimeout(function(){
      domainLayer.classList.remove("on");
      vignette.classList.remove("on");
      blackout.classList.remove("on","gone");
      gojoWrap.classList.remove("down","rumble");
      ryoikiText.classList.remove("on");
      counterText.classList.remove("on");
      flash.classList.remove("on");
      screenBoom.classList.remove("on");
      ring1.classList.remove("on");
      ring2.classList.remove("on");
      ring3.classList.remove("on");
      domainBusy=false;
      domainReady = performance.now() + COOLDOWN;
    }, TOTAL);
  }

  /* ---------- 루프 ---------- */
  var last=performance.now();
  function loop(now){
    var dt=Math.min((now-last)/16.67, 3); last=now;

    if(!bagWrap.classList.contains("exploding") && !bagWrap.classList.contains("dropping")){
      vel += -0.012*angle*dt;
      vel *= Math.pow(0.975, dt);
      angle += vel*dt;
      if(angle>1.05) { angle=1.05; vel*=-0.4; }
      if(angle<-1.05){ angle=-1.05; vel*=-0.4; }

      squash *= Math.pow(0.86, dt);

      pivot.style.transform = "rotate("+(angle*32)+"deg)";
      var sx = 1 + squash*0.85, sy = 1 - squash*0.55;
      bagWrap.style.transform = "scale("+sx+","+sy+") rotate("+(-angle*9)+"deg)";
    }

    shakeT += dt;
    shake *= Math.pow(0.85, dt);
    if(shake>0.01){
      var m=shake*12;
      shaker.style.transform="translate("+(Math.sin(shakeT*3.1)*m)+"px,"+(Math.cos(shakeT*2.3)*m*0.6)+"px)";
    } else {
      shaker.style.transform="translate(0,0)";
    }

    if(comboTimer>0){
      comboTimer -= dt/60;
      if(comboTimer<=0){ combo=0; comboEl.classList.remove("on"); }
    }

    if(!domainBusy){
      var left = domainReady - now;
      if(left>0){
        domainBtn.disabled=true;
        cool.style.width = (100 - (left/COOLDOWN)*100) + "%";
      } else {
        domainBtn.disabled=false;
        cool.style.width="0%";
      }
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---------- 입력 ---------- */
  function flashBtn(btn){ btn.classList.add("press"); setTimeout(function(){ btn.classList.remove("press"); },90); }
  var leftBtn=$("#leftBtn"), rightBtn=$("#rightBtn");

  document.addEventListener("keydown", function(e){
    if(setup.style.display==="none"){
      var k=e.key.toLowerCase();
      if(k==="a"||k==="arrowleft"){ hit(-1,1); flashBtn(leftBtn); e.preventDefault(); }
      else if(k==="d"||k==="arrowright"){ hit(1,1); flashBtn(rightBtn); e.preventDefault(); }
      else if(k==="r"){ startDomain(); flashBtn(domainBtn); e.preventDefault(); }
      else if(k==="escape"){ setup.style.display="grid"; }
    }
  });
  leftBtn.addEventListener("click", function(){ hit(-1,1); });
  rightBtn.addEventListener("click", function(){ hit(1,1); });
  domainBtn.addEventListener("click", startDomain);
  bag.addEventListener("pointerdown", function(e){
    var r=bag.getBoundingClientRect();
    hit(e.clientX < r.left+r.width/2 ? -1 : 1, 1);
  });
  escBtn.addEventListener("click", function(){ setup.style.display="grid"; });

  /* ---------- 설정 / 사진 자르기 ---------- */
  var cropState = { natW:0, natH:0, baseScale:1, scale:1, tx:0, ty:0, stageSize:0 };

  function clampCrop(){
    var minTx = cropState.stageSize - cropState.natW*cropState.scale;
    var minTy = cropState.stageSize - cropState.natH*cropState.scale;
    cropState.tx = Math.min(0, Math.max(minTx, cropState.tx));
    cropState.ty = Math.min(0, Math.max(minTy, cropState.ty));
  }
  function applyCropTransform(){
    cropImg.style.width = (cropState.natW*cropState.scale)+"px";
    cropImg.style.height = (cropState.natH*cropState.scale)+"px";
    cropImg.style.left = cropState.tx+"px";
    cropImg.style.top = cropState.ty+"px";
  }
  function openCropModal(imgSrc){
    cropImg.onload = function(){
      cropState.natW = cropImg.naturalWidth;
      cropState.natH = cropImg.naturalHeight;
      cropModal.classList.add("on");
      cropState.stageSize = cropStage.getBoundingClientRect().width;
      cropState.baseScale = cropState.stageSize / Math.min(cropState.natW, cropState.natH);
      cropState.scale = cropState.baseScale;
      cropZoom.value = 100;
      cropState.tx = (cropState.stageSize - cropState.natW*cropState.scale)/2;
      cropState.ty = (cropState.stageSize - cropState.natH*cropState.scale)/2;
      clampCrop();
      applyCropTransform();
    };
    cropImg.src = imgSrc;
  }

  var dragging=false, dragSX=0, dragSY=0, dragTx=0, dragTy=0;
  cropStage.addEventListener("pointerdown", function(e){
    dragging=true; cropStage.classList.add("grabbing");
    dragSX=e.clientX; dragSY=e.clientY; dragTx=cropState.tx; dragTy=cropState.ty;
    cropStage.setPointerCapture(e.pointerId);
  });
  cropStage.addEventListener("pointermove", function(e){
    if(!dragging) return;
    cropState.tx = dragTx + (e.clientX-dragSX);
    cropState.ty = dragTy + (e.clientY-dragSY);
    clampCrop();
    applyCropTransform();
  });
  function endDrag(){ dragging=false; cropStage.classList.remove("grabbing"); }
  cropStage.addEventListener("pointerup", endDrag);
  cropStage.addEventListener("pointercancel", endDrag);

  cropZoom.addEventListener("input", function(){
    var oldScale=cropState.scale;
    var cx=(cropState.stageSize/2 - cropState.tx)/oldScale;
    var cy=(cropState.stageSize/2 - cropState.ty)/oldScale;
    cropState.scale = cropState.baseScale * (cropZoom.value/100);
    cropState.tx = cropState.stageSize/2 - cx*cropState.scale;
    cropState.ty = cropState.stageSize/2 - cy*cropState.scale;
    clampCrop();
    applyCropTransform();
  });

  cropCancel.addEventListener("click", function(){
    cropModal.classList.remove("on");
    fileInput.value="";
  });
  cropConfirm.addEventListener("click", function(){
    var OUT=480;
    var canvas=document.createElement("canvas");
    canvas.width=OUT; canvas.height=OUT;
    var ctx=canvas.getContext("2d");
    var sx=(0-cropState.tx)/cropState.scale;
    var sy=(0-cropState.ty)/cropState.scale;
    var sSize=cropState.stageSize/cropState.scale;
    ctx.drawImage(cropImg, sx, sy, sSize, sSize, 0, 0, OUT, OUT);
    var dataUrl=canvas.toDataURL("image/png");
    photoURL=dataUrl;
    preview.innerHTML='<img alt="고른 사진 미리보기">';
    preview.firstChild.src=photoURL;
    cropModal.classList.remove("on");
    fileInput.value="";
  });

  fileInput.addEventListener("change", function(){
    var f=fileInput.files && fileInput.files[0];
    if(!f) return;
    var reader=new FileReader();
    reader.onload = function(){ openCropModal(reader.result); };
    reader.readAsDataURL(f);
  });

  $("#start").addEventListener("click", function(){
    var txt=$("#label").value.trim();
    nameTag.textContent = txt || "샌드백";
    if(photoURL){
      face.innerHTML='<img alt="샌드백에 붙인 사진">';
      face.firstChild.src=photoURL;
    }
    setup.style.display="none";
    ac();
    hits=0; countEl.textContent=0;
  });
})();
</script>
</body>
